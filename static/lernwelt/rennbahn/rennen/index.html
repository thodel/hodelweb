<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b1021; color: #e2e8f0; overflow: hidden;
               font-family: ui-monospace, Menlo, Consolas, monospace; }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
           background: radial-gradient(circle at 50% 25%, #2a1a12 0%, #0b1021 70%);
           padding: env(safe-area-inset-top) env(safe-area-inset-right)
                    env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #frame { display: flex; flex-direction: column; align-items: center; }
  #feld { position: relative; line-height: 0; }
  canvas { display: block; image-rendering: pixelated; border: 4px solid #1e293b; border-radius: 4px;
           box-shadow: 0 0 0 2px #0b1021, 0 12px 40px rgba(0,0,0,.6); background: #4a8fd6;
           touch-action: none; }
  .ov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
        justify-content: center; text-align: center; background: rgba(9,14,33,.93); padding: 14px; gap: 12px; }
  .ov[hidden] { display: none !important; }
  .t { font-size: clamp(19px,4.5vw,30px); font-weight: 900; color: #fde68a; letter-spacing: .1em;
       text-shadow: 3px 3px 0 #b45309; }
  .p { font-size: 12.5px; color: #cbd5e1; line-height: 1.9; max-width: 460px; }
  .p b { color: #fde68a; }
  .btn { cursor: pointer; border: 3px solid #fde68a; background: #12203f; color: #fde68a;
         padding: 12px 22px; font: 700 15px inherit; }
  .btn:hover { background: #1e3a5f; }
  .btn.gruen { border-color: #4ade80; color: #4ade80; }
  .reihe { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  kbd { background: #1e293b; border: 1px solid #475569; border-bottom-width: 3px; border-radius: 4px;
        padding: 2px 8px; font: inherit; font-size: 13px; color: #fde68a; }
  #hud { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
         padding: 6px 8px; font-size: 11px; pointer-events: none; gap: 6px; }
  #hud div { background: rgba(9,14,33,.78); border: 2px solid #334155; padding: 3px 7px; white-space: nowrap; }
  #hud b { color: #fde68a; }
  #frist { color: #fca5a5; }
  /* Steuerung unter der Strecke: lenken links, Gas und Bremse rechts */
  #steuer { display: none; }
  #steuer.on { display: flex; width: 100%; gap: 10px; justify-content: space-between; padding: 14px 8px 0; }
  #steuer .gruppe { display: flex; gap: 8px; }
  #steuer button { width: 92px; height: 96px; border-radius: 16px;
                   border: 3px solid #0ea5e9; background: rgba(56,189,248,.9); color: #082f49;
                   font: 900 20px inherit; touch-action: none; -webkit-user-select: none; user-select: none; }
  #steuer button.gas { background: rgba(74,222,128,.92); border-color: #16a34a; color: #052e16; width: 110px; }
  #steuer button.bremse { background: rgba(248,113,113,.92); border-color: #b91c1c; color: #450a0a; }
  #steuer button:active, #steuer button.an { filter: brightness(1.25); transform: translateY(2px); }
  a.back { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font-size: 10.5px;
           color: #cbd5e1; text-decoration: none; background: rgba(9,14,33,.8);
           border: 2px solid #334155; padding: 3px 8px; }
</style>

<body>
<div id="stage"><div id="frame">
 <div id="feld">
  <canvas id="c" width="320" height="200"></canvas>
  <div id="hud" hidden>
    <div id="h-runde">Runde <b>1/3</b></div>
    <div id="h-platz">Platz <b>6</b></div>
    <div id="h-tempo"><b>0</b> km/h</div>
    <div id="h-zeit">0.0 s</div>
  </div>

  <div class="ov" id="menu">
    <div class="t" id="m-titel">AUTORENNEN</div>
    <div class="p" id="m-text"></div>
    <div class="p">Lenken <kbd>←</kbd> <kbd>→</kbd> · Gas <kbd>↑</kbd> · Bremse <kbd>↓</kbd><br>
      Auf dem Tablet: die Knöpfe unter der Strecke.</div>
    <div class="reihe">
      <button class="btn gruen" id="m-start">Motor starten</button>
      <a class="btn" href="/lernwelt/rennbahn/" style="text-decoration:none">← zurück</a>
    </div>
  </div>

  <div class="ov" id="ende" hidden>
    <div class="t" id="e-t">ZIEL!</div>
    <div class="p" id="e-p"></div>
    <div class="reihe">
      <a class="btn gruen" id="e-faehre" href="/lernwelt/rennbahn/" style="text-decoration:none">Zur Fähre</a>
    </div>
  </div>
 </div>
 <div id="steuer">
   <div class="gruppe"><button id="k-links">◀</button><button id="k-rechts">▶</button></div>
   <div class="gruppe"><button id="k-bremse" class="bremse">BREMSE</button><button id="k-gas" class="gas">GAS</button></div>
 </div>
</div></div>

<script src="/lernwelt/insel.js"></script>
<script src="/lernwelt/dialog.js"></script>
<script>
(function () {
  'use strict';
  var W = 320, H = 200;
  var cv = document.getElementById('c'), ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  var $ = function (i) { return document.getElementById(i); };
  var who = Insel.who();
  var debug = new URLSearchParams(location.search).get('debug') === '1';

  /* ---------------- Zutritt ----------------
     Hierher kommt nur, wer mit der Fähre da ist und sein Rennen noch nicht
     gefahren hat. Alle anderen werden freundlich zurückgeschickt. */
  var kob = Insel.koboldePruefen(who);
  if (kob.gefangen) {
    Dialog.zeigen('Kobolde', ['Zu spät — die Kobolde haben dich schon. ' + kob.beute + ' Münzen weg, ab zu den Piraten.'],
      function () { window.location.href = '/lernwelt/piraten/'; });
    return;
  }
  var rb = Insel.rennbahnStand(who);
  if (!rb.dort) {
    Dialog.zeigen('Rennleitung', ['Ohne Fähre keine Rennbahn. Der Anleger liegt im Südosten der Lerninsel.'],
      function () { window.location.href = '/lernwelt/'; });
    return;
  }
  if (rb.gefahren) {
    Dialog.zeigen('Rennleitung', ['Dein Rennen ist gefahren. Ab zur Fähre — noch ' + rb.rest + ' Sekunden.'],
      function () { window.location.href = '/lernwelt/rennbahn/'; });
    return;
  }

  /* ---------------- Strecke ----------------
     Pseudo-3D wie in den alten Rennspielen: die Strecke ist eine Kette von
     Segmenten mit Kurvenwert; die Kamera hängt hinter dem Auto und projiziert
     jedes Segment auf den Bildschirm. Hügel gibt es keine — flach wie ein
     Formel-1-Kurs am Meer. */
  var SEG = 200;              /* Länge eines Segments (Welt-Einheiten) */
  var ROAD_W = 2000;          /* halbe Strassenbreite */
  var CAM_H = 1000;           /* Kamerahöhe */
  var CAM_D = 1 / Math.tan((100 / 2) * Math.PI / 180);   /* Bildweite bei 100° Sichtfeld */
  var SICHT = 90;             /* so viele Segmente werden gezeichnet */
  var MAX = SEG * 60;         /* Höchsttempo: ein Segment pro Bild bei 60 Hz */
  var KURVE = { leicht: 2, mittel: 3.5, eng: 5.5 };

  var KURSE = {
    palmenring: {
      himmel: ['#4a8fd6', '#bfe3ff'], gras: ['#5aa54a', '#4f9641'], rand: ['#dc2626', '#f8fafc'],
      deko: ['palme', 'palme', 'schild', 'palme', 'reifen'],
      gegner: [0.66, 0.70, 0.74, 0.77, 0.80], faktor: 6,
      bau: function (b) {
        b.gerade(40); b.kurve(55, KURVE.leicht); b.gerade(25); b.kurve(45, -KURVE.mittel);
        b.gerade(25); b.kurve(60, KURVE.leicht); b.gerade(20); b.kurve(30, -KURVE.leicht); b.gerade(15);
      }
    },
    felsenpass: {
      himmel: ['#7c5a9e', '#f9c784'], gras: ['#8a7a5a', '#7a6b4c'], rand: ['#f59e0b', '#1f2937'],
      deko: ['fels', 'fels', 'schild', 'kaktus', 'fels', 'reifen'],
      gegner: [0.60, 0.64, 0.68, 0.71, 0.74], faktor: 7,
      bau: function (b) {
        b.gerade(25); b.kurve(30, KURVE.eng); b.kurve(30, -KURVE.eng); b.gerade(15); b.kurve(40, KURVE.mittel);
        b.kurve(25, -KURVE.eng); b.gerade(20); b.kurve(35, KURVE.eng); b.gerade(10); b.kurve(30, -KURVE.mittel); b.gerade(20);
      }
    },
    'grosser-preis': {
      himmel: ['#1e3a8a', '#f87171'], gras: ['#3d8f57', '#348049'], rand: ['#dc2626', '#f8fafc'],
      deko: ['tribuene', 'schild', 'palme', 'reifen', 'schild', 'palme', 'tribuene'],
      gegner: [0.70, 0.74, 0.78, 0.82, 0.86], faktor: 5,
      bau: function (b) {
        b.gerade(60); b.kurve(50, KURVE.leicht); b.gerade(40); b.kurve(60, -KURVE.mittel); b.kurve(40, KURVE.mittel);
        b.gerade(50); b.kurve(80, -KURVE.leicht); b.kurve(30, KURVE.eng); b.gerade(40); b.kurve(35, -KURVE.mittel); b.gerade(30);
      }
    }
  };
  var kursId = new URLSearchParams(location.search).get('kurs');
  if (!KURSE[kursId]) kursId = 'palmenring';
  var kurs = KURSE[kursId];
  var kursInfo = Insel.rennkurs(kursId) || { name: kursId, runden: 3 };
  var RUNDEN = kursInfo.runden || 3;

  var segmente = [];
  function segmentHinzu(curve) {
    var n = segmente.length;
    segmente.push({ index: n, curve: curve,
                    p1: { world: { z: n * SEG }, camera: {}, screen: {} },
                    p2: { world: { z: (n + 1) * SEG }, camera: {}, screen: {} },
                    sprites: [], autos: [] });
  }
  function einAus(a, b, pct) { return a + (b - a) * ((-Math.cos(pct * Math.PI) / 2) + 0.5); }
  /* Die Kurse sind in groben Stücken notiert; 'faktor' streckt sie so, dass
     eine Runde bei vollem Tempo gut 30 Sekunden dauert. */
  var bauer = {
    gerade: function (n) { n = Math.round(n * kurs.faktor); for (var i = 0; i < n; i++) segmentHinzu(0); },
    kurve: function (n, c) {
      n = Math.round(n * kurs.faktor);
      var rein = Math.round(n / 3), raus = Math.round(n / 3), mitte = n - rein - raus;
      for (var i = 0; i < rein; i++) segmentHinzu(einAus(0, c, i / rein));
      for (var j = 0; j < mitte; j++) segmentHinzu(c);
      for (var k = 0; k < raus; k++) segmentHinzu(einAus(c, 0, k / raus));
    }
  };
  kurs.bau(bauer);
  var N = segmente.length, LAENGE = N * SEG;

  /* Deko am Strassenrand: regelmässig, abwechselnd links und rechts. */
  (function () {
    var i, d = 0;
    for (i = 6; i < N; i += 9) {
      var art = kurs.deko[d++ % kurs.deko.length];
      var seite = (Math.floor(i / 9) % 2) ? -1 : 1;
      segmente[i].sprites.push({ art: art, offset: seite * (art === 'tribuene' ? 2.2 : 1.35 + (i % 3) * 0.25) });
      if (art === 'palme' && i + 3 < N) segmente[i + 3].sprites.push({ art: 'palme', offset: -seite * 1.6 });
    }
    /* Kobolde, die am Rand winken */
    for (i = 20; i < N; i += 97) segmente[i].sprites.push({ art: 'kobold', offset: (i % 2 ? 1 : -1) * 1.2 });
  })();

  /* ---------------- Fahrzeuge ---------------- */
  var FARBEN = ['#2563eb', '#16a34a', '#facc15', '#f8fafc', '#a855f7'];
  var NAMEN = ['Blitz-Berta', 'Turbo-Tom', 'Kurven-Kim', 'Gas-Gisela', 'Rasen-Ralf'];
  var SPIELER_FARBE = '#dc2626';
  var autos = [];
  function autosAufstellen() {
    autos = [];
    kurs.gegner.forEach(function (f, i) {
      autos.push({ name: NAMEN[i], farbe: FARBEN[i], tempo: f * MAX, z: (i + 1) * SEG * 2.5,
                   offset: (i % 2 ? 0.45 : -0.45) * (1 - i * 0.08), dist: (i + 1) * SEG * 2.5, seg: null });
    });
  }

  /* Spieler */
  var position = 0, tempo = 0, spielerX = 0, lenkung = 0;
  var zustand = 'menu';   /* menu | ampel | rennen | ziel */
  var ampelT = 0, zeit = 0, runde = 1, letztePos = 0, rundenZeiten = [], rundenStart = 0;
  var platz = 6, kollisionT = 0, holperT = 0, himmelX = 0;
  var tasten = Object.create(null), tipp = { links: false, rechts: false, gas: false, bremse: false };
  var fertig = null;

  function segmentBei(z) {
    return segmente[Math.floor(((z % LAENGE) + LAENGE) % LAENGE / SEG) % N];
  }

  function schritt(dt) {
    var tempoPct = tempo / MAX;
    var seg = segmentBei(position);
    var links = tasten['arrowleft'] || tasten['a'] || tipp.links;
    var rechts = tasten['arrowright'] || tasten['d'] || tipp.rechts;
    var gas = tasten['arrowup'] || tasten['w'] || tipp.gas;
    var bremse = tasten['arrowdown'] || tasten['s'] || tipp.bremse;

    if (zustand === 'ampel') {
      ampelT += dt;
      gas = false; bremse = true;
      if (ampelT >= 4.2) { zustand = 'rennen'; zeit = 0; rundenStart = 0; }
    }
    if (zustand === 'ziel') { gas = false; bremse = false; links = rechts = false; }

    var dx = dt * 2 * tempoPct;
    lenkung = links ? -1 : rechts ? 1 : 0;
    if (links) spielerX -= dx;
    if (rechts) spielerX += dx;
    /* Fliehkraft: in der Kurve drückt es nach aussen. */
    spielerX -= dx * tempoPct * seg.curve * 0.3;

    if (zustand === 'ziel') tempo = Math.max(0, tempo - MAX * 0.5 * dt);
    else if (gas) tempo += MAX / 4.5 * dt;
    else if (bremse) tempo -= MAX * 0.9 * dt;
    else tempo -= MAX / 6 * dt;

    /* Neben der Strecke: holprig und langsam. */
    holperT = 0;
    if ((spielerX < -1 || spielerX > 1) && tempo > MAX / 4) {
      tempo -= MAX * 0.6 * dt;
      holperT = 1;
    }
    /* Zusammenstoss mit einem Gegner: abbremsen, kurz nicht nochmal. */
    if (kollisionT > 0) kollisionT -= dt;
    for (var i = 0; i < autos.length && kollisionT <= 0; i++) {
      var a = autos[i];
      var dz = ((a.z - position) % LAENGE + LAENGE) % LAENGE;
      if (dz < SEG * 0.9 && Math.abs(a.offset - spielerX) < 0.55 && tempo > a.tempo) {
        tempo = a.tempo * 0.55;
        kollisionT = 0.6;
        spielerX += (spielerX >= a.offset ? 1 : -1) * 0.15;
      }
    }
    tempo = Math.max(0, Math.min(MAX, tempo));
    spielerX = Math.max(-2.2, Math.min(2.2, spielerX));

    letztePos = position;
    position += tempo * dt;
    if (position >= LAENGE) {
      position -= LAENGE;
      if (zustand === 'rennen') {
        rundenZeiten.push(zeit - rundenStart);
        rundenStart = zeit;
        runde++;
        if (runde > RUNDEN) zielErreicht();
      }
    }
    himmelX += seg.curve * tempoPct * dt * 30;

    /* Gegner: gleichmässig, auf ihrer Spur. */
    autos.forEach(function (a) {
      a.z += a.tempo * dt; a.dist += a.tempo * dt;
      if (a.z >= LAENGE) a.z -= LAENGE;
    });
    if (zustand === 'rennen' || zustand === 'ampel') zeit += zustand === 'rennen' ? dt : 0;
    platz = rang();
  }

  function spielerDist() { return (runde - 1) * LAENGE + position; }
  function rang() {
    var d = spielerDist(), r = 1;
    autos.forEach(function (a) { if (a.dist > d) r++; });
    return r;
  }

  /* ---------------- Projektion ---------------- */
  function projizieren(p, camX, camY, camZ) {
    p.camera.x = (p.world.x || 0) - camX;
    p.camera.y = (p.world.y || 0) - camY;
    p.camera.z = p.world.z - camZ;
    p.screen.scale = CAM_D / p.camera.z;
    p.screen.x = Math.round(W / 2 + p.screen.scale * p.camera.x * W / 2);
    p.screen.y = Math.round(H / 2 - p.screen.scale * p.camera.y * H / 2);
    p.screen.w = Math.round(p.screen.scale * ROAD_W * W / 2);
  }
  function trapez(x1, y1, w1, x2, y2, w2, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(x1 - w1, y1); ctx.lineTo(x2 - w2, y2); ctx.lineTo(x2 + w2, y2); ctx.lineTo(x1 + w1, y1);
    ctx.closePath(); ctx.fill();
  }
  function rekt(x, y, w, h, col) {
    ctx.fillStyle = col;
    ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(w)), Math.max(1, Math.round(h)));
  }

  /* ---------------- Sprites (skaliert, in Bruchteilen der halben Strassenbreite) ---------------- */
  /* zeichnet mit Fusspunkt (cx, by); sw/sh = Bildschirmgrösse */
  var SPRITES = {
    palme: { w: 0.5, h: 1.1, mal: function (cx, by, sw, sh) {
      rekt(cx - sw * 0.05, by - sh * 0.75, sw * 0.1, sh * 0.75, '#6b4423');
      rekt(cx - sw * 0.5, by - sh * 0.9, sw * 0.42, sh * 0.12, '#2f7d3a');
      rekt(cx + sw * 0.08, by - sh * 0.9, sw * 0.42, sh * 0.12, '#2f7d3a');
      rekt(cx - sw * 0.3, by - sh, sw * 0.6, sh * 0.14, '#3d9c49');
      rekt(cx - sw * 0.4, by - sh * 0.8, sw * 0.25, sh * 0.1, '#25642e');
      rekt(cx + sw * 0.15, by - sh * 0.8, sw * 0.25, sh * 0.1, '#25642e');
    } },
    fels: { w: 0.7, h: 0.5, mal: function (cx, by, sw, sh) {
      rekt(cx - sw / 2, by - sh * 0.6, sw, sh * 0.6, '#6b7280');
      rekt(cx - sw * 0.35, by - sh, sw * 0.6, sh * 0.45, '#9ca3af');
      rekt(cx - sw * 0.45, by - sh * 0.2, sw * 0.9, sh * 0.2, '#4b5563');
    } },
    kaktus: { w: 0.3, h: 0.7, mal: function (cx, by, sw, sh) {
      rekt(cx - sw * 0.15, by - sh, sw * 0.3, sh, '#15803d');
      rekt(cx - sw * 0.5, by - sh * 0.7, sw * 0.35, sh * 0.12, '#15803d');
      rekt(cx - sw * 0.5, by - sh * 0.9, sw * 0.14, sh * 0.3, '#15803d');
      rekt(cx + sw * 0.15, by - sh * 0.55, sw * 0.35, sh * 0.12, '#15803d');
      rekt(cx + sw * 0.36, by - sh * 0.8, sw * 0.14, sh * 0.35, '#15803d');
    } },
    schild: { w: 0.8, h: 0.6, mal: function (cx, by, sw, sh) {
      rekt(cx - sw * 0.45, by - sh * 0.6, sw * 0.08, sh * 0.6, '#6b7280');
      rekt(cx + sw * 0.37, by - sh * 0.6, sw * 0.08, sh * 0.6, '#6b7280');
      rekt(cx - sw / 2, by - sh, sw, sh * 0.5, '#fde68a');
      rekt(cx - sw * 0.45, by - sh * 0.95, sw * 0.9, sh * 0.4, '#b45309');
      if (sw > 30) {
        ctx.fillStyle = '#fde68a';
        ctx.font = 'bold ' + Math.max(6, Math.round(sh * 0.22)) + 'px ui-monospace, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('LERNINSEL', cx, by - sh * 0.68);
      }
    } },
    reifen: { w: 0.35, h: 0.35, mal: function (cx, by, sw, sh) {
      rekt(cx - sw / 2, by - sh, sw, sh, '#111827');
      rekt(cx - sw * 0.4, by - sh * 0.85, sw * 0.8, sh * 0.12, '#f8fafc');
      rekt(cx - sw * 0.4, by - sh * 0.45, sw * 0.8, sh * 0.12, '#f8fafc');
    } },
    tribuene: { w: 2.4, h: 0.9, mal: function (cx, by, sw, sh) {
      rekt(cx - sw / 2, by - sh * 0.8, sw, sh * 0.8, '#1d4ed8');
      rekt(cx - sw / 2, by - sh, sw, sh * 0.25, '#ea580c');
      var n = Math.max(3, Math.floor(sw / 6));
      for (var r = 0; r < 3; r++) for (var p = 0; p < n; p++) {
        rekt(cx - sw / 2 + (p + 0.5) * sw / n - sw / n * 0.25, by - sh * (0.72 - r * 0.2), sw / n * 0.5, sh * 0.1,
             ['#fde68a', '#f9a8d4', '#86efac', '#fca5a5', '#e2e8f0'][(p + r) % 5]);
      }
    } },
    kobold: { w: 0.22, h: 0.4, mal: function (cx, by, sw, sh) {
      rekt(cx - sw * 0.3, by - sh * 0.5, sw * 0.6, sh * 0.5, '#166534');
      rekt(cx - sw * 0.35, by - sh * 0.9, sw * 0.7, sh * 0.42, '#4ade80');
      rekt(cx - sw * 0.6, by - sh * 0.9, sw * 0.25, sh * 0.12, '#4ade80');
      rekt(cx + sw * 0.35, by - sh * 0.9, sw * 0.25, sh * 0.12, '#4ade80');
      rekt(cx - sw * 0.2, by - sh, sw * 0.4, sh * 0.14, '#7f1d1d');
      rekt(cx + sw * 0.3, by - sh * 0.75 + Math.sin(Date.now() / 120) * sh * 0.08, sw * 0.45, sh * 0.1, '#4ade80');
    } }
  };

  /* Ein Formel-Auto von hinten. s = Skalierung (1 = Spieler), lenk = -1..1 */
  function autoMalen(cx, by, s, farbe, lenk, dunkel) {
    var w = 56 * s, h = 26 * s;
    var tilt = Math.round(lenk * 2 * s);
    /* Schatten */
    rekt(cx - w * 0.5, by - h * 0.06, w, h * 0.12, 'rgba(0,0,0,.28)');
    /* Hinterräder */
    rekt(cx - w * 0.5, by - h * 0.62, w * 0.2, h * 0.62, '#111827');
    rekt(cx + w * 0.3, by - h * 0.62, w * 0.2, h * 0.62, '#111827');
    rekt(cx - w * 0.47, by - h * 0.55, w * 0.14, h * 0.1, '#52525b');
    rekt(cx + w * 0.33, by - h * 0.55, w * 0.14, h * 0.1, '#52525b');
    /* Heckflügel */
    rekt(cx - w * 0.46 + tilt, by - h * 0.95, w * 0.92, h * 0.16, farbe);
    rekt(cx - w * 0.46 + tilt, by - h * 0.8, w * 0.92, h * 0.05, dunkel);
    rekt(cx - w * 0.3 + tilt, by - h * 0.8, w * 0.06, h * 0.25, dunkel);
    rekt(cx + w * 0.24 + tilt, by - h * 0.8, w * 0.06, h * 0.25, dunkel);
    /* Rumpf */
    rekt(cx - w * 0.22 + tilt, by - h * 0.62, w * 0.44, h * 0.58, farbe);
    rekt(cx - w * 0.22 + tilt, by - h * 0.62, w * 0.44, h * 0.08, dunkel);
    rekt(cx - w * 0.1 + tilt, by - h * 0.3, w * 0.2, h * 0.14, '#111827');      /* Auspuff/Diffusor */
    /* Airbox und Helm */
    rekt(cx - w * 0.08 + tilt, by - h * 1.05, w * 0.16, h * 0.45, farbe);
    rekt(cx - w * 0.09 + tilt * 1.5, by - h * 0.92, w * 0.18, h * 0.2, '#fde68a');
    rekt(cx - w * 0.07 + tilt * 1.5, by - h * 0.9, w * 0.14, h * 0.06, '#1e293b');
    /* Vorderräder (schauen seitlich hervor) */
    rekt(cx - w * 0.56 + tilt * 2, by - h * 1.0, w * 0.13, h * 0.3, '#111827');
    rekt(cx + w * 0.43 + tilt * 2, by - h * 1.0, w * 0.13, h * 0.3, '#111827');
  }
  function dunkler(hex) {
    var n = parseInt(hex.slice(1), 16);
    return 'rgb(' + Math.max(0, (n >> 16) - 60) + ',' + Math.max(0, ((n >> 8) & 255) - 60) + ',' + Math.max(0, (n & 255) - 60) + ')';
  }

  /* ---------------- Zeichnen ---------------- */
  function zeichne() {
    /* Himmel */
    var g = ctx.createLinearGradient(0, 0, 0, H / 2);
    g.addColorStop(0, kurs.himmel[0]); g.addColorStop(1, kurs.himmel[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H / 2);
    /* Sonne */
    rekt(W * 0.72 - himmelX * 0.15, 22, 18, 18, '#fde68a');
    rekt(W * 0.72 - himmelX * 0.15 + 3, 19, 12, 24, '#fde68a');
    /* Meer und Hügel (Parallaxe zur Kurve) */
    rekt(0, H / 2 - 16, W, 16, '#1c6ea4');
    for (var hx = -40; hx < W + 40; hx += 4) {
      var hh = 10 + Math.sin((hx + himmelX * 0.6) * 0.045) * 7 + Math.sin((hx + himmelX * 0.6) * 0.11) * 3;
      rekt(hx, H / 2 - 16 - hh, 4, hh, '#2d6a4f');
      var hh2 = 16 + Math.sin((hx + himmelX * 0.3) * 0.03 + 2) * 9;
      rekt(hx, H / 2 - 16 - hh2, 4, Math.max(0, hh2 - hh), '#4b7f68');
    }

    var basis = segmentBei(position);
    var basisPct = (position % SEG) / SEG;
    var camX = spielerX * ROAD_W;
    var x = 0, dx = -(basis.curve * basisPct);
    var maxy = H;
    var n, seg;

    for (n = 0; n < SICHT; n++) {
      seg = segmente[(basis.index + n) % N];
      seg.looped = seg.index < basis.index;
      seg.clip = maxy;
      projizieren(seg.p1, camX - x, CAM_H, position - (seg.looped ? LAENGE : 0));
      projizieren(seg.p2, camX - x - dx, CAM_H, position - (seg.looped ? LAENGE : 0));
      x += dx; dx += seg.curve;
      if (seg.p1.camera.z <= CAM_D || seg.p2.screen.y >= maxy || seg.p2.screen.y >= seg.p1.screen.y) continue;

      var p1 = seg.p1.screen, p2 = seg.p2.screen;
      var hell = Math.floor(seg.index / 3) % 2;
      /* Gras, Randstein, Strasse, Mittellinie */
      rekt(0, p2.y, W, p1.y - p2.y, kurs.gras[hell]);
      trapez(p1.x, p1.y, p1.w * 1.12, p2.x, p2.y, p2.w * 1.12, kurs.rand[hell]);
      trapez(p1.x, p1.y, p1.w, p2.x, p2.y, p2.w, hell ? '#52525b' : '#4b4b52');
      if (hell) trapez(p1.x, p1.y, p1.w * 0.02, p2.x, p2.y, p2.w * 0.02, '#e4e4e7');
      /* Start-Ziel-Linie */
      if (seg.index === 0) {
        for (var k = -1; k < 1; k += 0.125) {
          trapez(p1.x + p1.w * (k + 0.0625), p1.y, p1.w * 0.0625, p2.x + p2.w * (k + 0.0625), p2.y, p2.w * 0.0625,
                 Math.round(k * 8) % 2 ? '#111827' : '#f8fafc');
        }
      }
      maxy = p2.y;
    }

    /* Sprites und Gegner — von hinten nach vorn */
    for (n = SICHT - 1; n > 0; n--) {
      seg = segmente[(basis.index + n) % N];
      var sc = seg.p1.screen.scale, sx = seg.p1.screen.x, sy = seg.p1.screen.y, sw0 = seg.p1.screen.w;
      if (seg.p1.camera.z <= CAM_D) continue;
      seg.sprites.forEach(function (sp) {
        var def = SPRITES[sp.art];
        if (!def) return;
        var w = sw0 * def.w, h = sw0 * def.h;
        var cx = sx + sw0 * sp.offset + (sp.offset < 0 ? -w / 2 : w / 2);
        if (sy > seg.clip || w < 1) return;
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, seg.clip); ctx.clip();
        def.mal(cx, sy, w, h);
        ctx.restore();
      });
      /* Zielbogen über der Start-Ziel-Linie */
      if (seg.index === 0 && sw0 > 6) {
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, seg.clip); ctx.clip();
        var hb = sw0 * 0.9;
        rekt(sx - sw0 * 1.1, sy - hb, sw0 * 0.06, hb, '#e2e8f0');
        rekt(sx + sw0 * 1.04, sy - hb, sw0 * 0.06, hb, '#e2e8f0');
        for (var q = 0; q < 12; q++) rekt(sx - sw0 * 1.1 + q * sw0 * 2.2 / 12, sy - hb, sw0 * 2.2 / 12, hb * 0.2, q % 2 ? '#111827' : '#f8fafc');
        ctx.restore();
      }
      autos.forEach(function (a) {
        if (segmentBei(a.z) !== seg) return;
        var pct = (a.z % SEG) / SEG;
        var s2 = seg.p2.screen;
        var scale = sc + (s2.scale - sc) * pct;
        var ax = sx + (s2.x - sx) * pct + (sw0 + (s2.w - sw0) * pct) * a.offset;
        var ay = sy + (s2.y - sy) * pct;
        var gr = scale * ROAD_W * W / 2 / 60;  /* 1 = Spielergrösse am unteren Rand */
        if (ay > seg.clip + 2 || gr < 0.03) return;
        ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, seg.clip + 2); ctx.clip();
        autoMalen(ax, ay, Math.min(1.6, gr), a.farbe, 0, dunkler(a.farbe));
        ctx.restore();
      });
    }

    /* Spielerauto */
    var holper = holperT && tempo > 0 ? Math.round(Math.random() * 2) : 0;
    autoMalen(W / 2, H - 10 + holper, 1, SPIELER_FARBE, lenkung, dunkler(SPIELER_FARBE));

    /* Startampel */
    if (zustand === 'ampel') {
      var an = Math.min(5, Math.floor(ampelT / 0.7));
      var los = ampelT >= 3.5;
      rekt(W / 2 - 46, 40, 92, 26, '#111827');
      for (var l = 0; l < 5; l++) {
        rekt(W / 2 - 40 + l * 17, 45, 14, 16, los ? '#16a34a' : (l < an ? '#dc2626' : '#3f3f46'));
      }
      if (los) {
        ctx.fillStyle = '#4ade80'; ctx.font = 'bold 16px ui-monospace, monospace'; ctx.textAlign = 'center';
        ctx.fillText('LOS!', W / 2, 86);
      }
    }
    if (zustand === 'ziel') {
      ctx.fillStyle = '#fde68a'; ctx.font = 'bold 14px ui-monospace, monospace'; ctx.textAlign = 'center';
      ctx.fillText('🏁 ZIEL', W / 2, 80);
    }
  }

  /* ---------------- HUD ---------------- */
  var hudT = 0;
  function hudMalen() {
    $('h-runde').innerHTML = 'Runde <b>' + Math.min(runde, RUNDEN) + '/' + RUNDEN + '</b>';
    $('h-platz').innerHTML = 'Platz <b>' + platz + '</b>/' + (autos.length + 1);
    $('h-tempo').innerHTML = '<b>' + Math.round(tempo / MAX * 320) + '</b> km/h';
    $('h-zeit').textContent = zeit.toFixed(1) + ' s';
  }

  /* ---------------- Ablauf ---------------- */
  function start() {
    autosAufstellen();
    position = 0; tempo = 0; spielerX = 0; lenkung = 0;
    zeit = 0; runde = 1; rundenZeiten = []; rundenStart = 0; ampelT = 0; platz = 6;
    zustand = 'ampel';
    $('menu').hidden = true;
    $('hud').hidden = false;
  }

  function zielErreicht() {
    zustand = 'ziel';
    var endPlatz = rang();
    var r = Insel.rennenMelden({ kurs: kursId, platz: endPlatz, zeit: zeit, fahrer: autos.length + 1 }, who);
    fertig = r;
    var titel = endPlatz === 1 ? 'GEWONNEN!' : endPlatz <= 3 ? 'PODEST!' : 'IM ZIEL';
    var text = ['🥇 Erster', '🥈 Zweiter', '🥉 Dritter', 'Vierter', 'Fünfter', 'Sechster'][endPlatz - 1] +
               ' auf dem ' + kursInfo.name + ' nach ' + zeit.toFixed(1) + ' s.';
    var beste = rundenZeiten.length ? Math.min.apply(null, rundenZeiten) : 0;
    if (beste) text += '<br>Schnellste Runde: ' + beste.toFixed(1) + ' s.';
    if (r.ok) {
      text += r.preisgeld
        ? '<br><br><span style="color:#fbbf24;font-weight:700">Preisgeld: + ' + r.preisgeld + ' 🪙</span>'
        : '<br><br><span style="color:#94a3b8">Kein Preisgeld — das gibt es für die ersten drei.</span>';
      if (r.melden && r.melden.muenzen) text += ' <span style="color:#fbbf24">+ ' + r.melden.muenzen + ' 🪙</span> ' + r.melden.grund;
      if (r.neueBestzeit) text += '<br>Neue Bestzeit auf dieser Strecke!';
      text += '<br><br><b id="e-frist">Jetzt zur Fähre — noch ' + fristText() + '.</b> Sonst kommen die Kobolde.';
    } else {
      text += '<br><br><span style="color:#fca5a5">Dieses Rennen zählt nicht (' + r.grund + ').</span>';
    }
    $('e-t').textContent = titel;
    $('e-p').innerHTML = text;
    setTimeout(function () { $('hud').hidden = true; $('ende').hidden = false; }, 1600);
  }
  function fristText() {
    var s = Insel.rennbahnStand(who).rest;
    return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60);
  }
  /* Auch auf dem Zielbildschirm läuft die Uhr der Kobolde weiter. */
  setInterval(function () {
    var k = Insel.koboldePruefen(who);
    if (k.gefangen) {
      Dialog.zeigen('Kobolde', ['Zu lange gefeiert! Die Kobolde zerren dich vom Siegerpodest — ' + k.beute +
        ' Münzen weg, und ab zu den Piraten.'], function () { window.location.href = '/lernwelt/piraten/'; });
      return;
    }
    var el = $('e-frist');
    if (el) el.textContent = 'Jetzt zur Fähre — noch ' + fristText() + '.';
  }, 1000);

  /* ---------------- Eingabe ---------------- */
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].indexOf(k) >= 0) e.preventDefault();
    tasten[k] = true;
    if (zustand === 'menu' && (k === 'enter' || k === ' ')) start();
  });
  window.addEventListener('keyup', function (e) { tasten[e.key.toLowerCase()] = false; });
  window.addEventListener('blur', function () { tasten = Object.create(null); });
  function knopf(el, name) {
    var an = function (e) { e.preventDefault(); tipp[name] = true; el.classList.add('an'); };
    var aus = function (e) { e.preventDefault(); tipp[name] = false; el.classList.remove('an'); };
    el.addEventListener('touchstart', an, { passive: false });
    el.addEventListener('touchend', aus, { passive: false });
    el.addEventListener('touchcancel', aus, { passive: false });
    el.addEventListener('mousedown', an);
    el.addEventListener('mouseup', aus);
    el.addEventListener('mouseleave', aus);
  }
  knopf($('k-links'), 'links'); knopf($('k-rechts'), 'rechts');
  knopf($('k-gas'), 'gas'); knopf($('k-bremse'), 'bremse');
  $('m-start').onclick = start;

  var isTouch = new URLSearchParams(location.search).get('touch') === '1' ||
                window.matchMedia('(hover: none)').matches || 'ontouchstart' in window;
  if (isTouch) $('steuer').classList.add('on');
  function resize() {
    var vv = window.visualViewport;
    var b = Math.round(vv ? vv.width : innerWidth), h = Math.round(vv ? vv.height : innerHeight);
    var band = isTouch ? 124 : 0;
    var s = Math.max(1, Math.min(5, Math.floor(Math.min((b - 16) / W, (h - 16 - band) / H) * 2) / 2));
    cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  }
  addEventListener('resize', resize);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
  resize();

  /* Menü */
  $('m-titel').textContent = kursInfo.name.toUpperCase();
  $('m-text').innerHTML = (kursInfo.kurz ? kursInfo.kurz.charAt(0).toUpperCase() + kursInfo.kurz.slice(1) + '. ' : '') +
    '<b>' + RUNDEN + ' Runden</b>, ' + (Math.round(LAENGE / 10000) / 10).toFixed(1).replace('.', ',') + ' km je Runde, fünf Gegner — du startest hinten.<br>' +
    'Preisgeld: <b>' + Insel.oekonomie.rennPreisgeld.join(' · ') + '</b> Münzen für die ersten drei.';

  var letzteZeit = 0;
  function schleife(ts) {
    var dt = Math.min(0.05, (ts - letzteZeit) / 1000 || 0);
    letzteZeit = ts;
    if (zustand !== 'menu') schritt(dt);
    zeichne();
    hudT += dt;
    if (hudT > 0.1 && zustand !== 'menu') { hudT = 0; hudMalen(); }
    requestAnimationFrame(schleife);
  }
  requestAnimationFrame(function (t) { letzteZeit = t; schleife(t); });

  /* Zum Prüfen ohne sichtbares Fenster: Zeit vorspulen, mit Autopilot fahren. */
  if (debug) {
    window.__rennen = {
      start: start,
      tick: function (sek, auto) {
        var n = Math.round((sek || 1) / 0.02);
        for (var i = 0; i < n; i++) {
          if (auto) {
            /* Autopilot: Vollgas, in engen Kurven lupfen, zur Mitte lenken. */
            var seg = segmentBei(position + SEG * 6);
            var c = Math.abs(seg.curve);
            tasten['arrowup'] = !(c > 3 && tempo > MAX * 0.7) && !(c > 4.5 && tempo > MAX * 0.6);
            tasten['arrowdown'] = c > 4.5 && tempo > MAX * 0.72;
            var ziel = -seg.curve * 0.12;
            tasten['arrowleft'] = spielerX > ziel + 0.05;
            tasten['arrowright'] = spielerX < ziel - 0.05;
          }
          schritt(0.02);
          if (zustand === 'ziel' && fertig) break;
        }
        zeichne(); hudMalen();
        return { zustand: zustand, runde: runde, platz: platz, zeit: Math.round(zeit * 10) / 10,
                 tempo: Math.round(tempo / MAX * 100), x: Math.round(spielerX * 100) / 100, fertig: fertig };
      },
      zustand: function () { return { zustand: zustand, runde: runde, platz: platz, zeit: zeit, N: N }; }
    };
  }
})();
</script>
</body>
</html>
