<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestenliste — Lerninsel</title>
<link rel="icon" href="/favicon-32x32.png" sizes="32x32">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
         background: #0f172a; color: #e2e8f0; padding: 18px 14px 60px; min-height: 100vh; }
  .wrap { max-width: 680px; margin: 0 auto; }
  h1 { font-size: 26px; text-align: center; font-weight: 800; }
  .sub { text-align: center; font-size: 13px; color: #94a3b8; margin: 6px 0 20px; }

  .gesamt { display: flex; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .kind { flex: 1; min-width: 150px; background: #1e293b; border: 2px solid #334155;
          border-radius: 16px; padding: 16px 12px; text-align: center; }
  .kind.fuehrt { border-color: #fbbf24; box-shadow: 0 0 0 3px rgba(251,191,36,.15); }
  .kind .e { font-size: 30px; }
  .kind .n { font-size: 17px; font-weight: 800; margin-top: 2px; }
  .kind .kl { font-size: 11px; color: #94a3b8; }
  .kind .p { font-size: 30px; font-weight: 900; color: #fbbf24; margin-top: 8px; line-height: 1.1; }
  .kind .pl { font-size: 11px; color: #94a3b8; }

  .fach { background: #1e293b; border: 2px solid #334155; border-left-width: 6px;
          border-radius: 16px; padding: 16px 18px; margin-bottom: 14px; }
  .fach.mathe { border-left-color: #7dd3fc; }
  .fach.deutsch { border-left-color: #a7f3d0; }
  .fach.englisch { border-left-color: #fca5a5; }
  .fach.nmg { border-left-color: #fcd34d; }
  .fach h2 { font-size: 17px; margin-bottom: 3px; }
  .fach .lp { font-size: 11px; color: #64748b; font-family: ui-monospace, Menlo, monospace;
              margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: right; font-size: 11px; color: #64748b; font-weight: 600; padding-bottom: 6px; }
  th:first-child { text-align: left; }
  td { padding: 8px 0; border-top: 1px solid #334155; text-align: right; }
  td:first-child { text-align: left; font-weight: 700; }
  .balken { height: 7px; background: #0f172a; border-radius: 99px; overflow: hidden; margin-top: 5px; }
  .balken i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg,#38bdf8,#818cf8); }
  .sieger { color: #fbbf24; }
  .leer { color: #64748b; font-size: 13px; font-style: italic; }
  .top { background: #0f172a; border-radius: 12px; padding: 12px 14px; margin-top: 12px;
         font-size: 13px; color: #cbd5e1; line-height: 1.8; }
  .top b { color: #fbbf24; }
  /* Wochenduell */
  .duell { background: linear-gradient(180deg,#2a2010,#1e293b); border: 2px solid #fbbf24;
           border-radius: 16px; padding: 16px 18px; margin-bottom: 18px; }
  .duell h2 { font-size: 17px; color: #fbbf24; display: flex; justify-content: space-between;
              align-items: baseline; gap: 10px; }
  .duell h2 small { font-size: 11.5px; font-weight: 600; color: #94a3b8; }
  .dz { display: flex; align-items: center; gap: 10px; padding: 9px 0;
        border-top: 1px solid #3f3520; font-size: 14px; }
  .dz:first-of-type { border-top: 0; }
  .dz .r { width: 22px; font-weight: 800; color: #64748b; text-align: right; }
  .dz .n { flex: 1; font-weight: 700; }
  .dz .b { flex: 2; height: 9px; background: #0f172a; border-radius: 99px; overflow: hidden; }
  .dz .b i { display: block; height: 100%; border-radius: 99px;
             background: linear-gradient(90deg,#f59e0b,#fbbf24); }
  .dz .p { width: 62px; text-align: right; font-weight: 800; color: #fbbf24; }
  .dz.fuehrt .n { color: #fde68a; }
  .duell .fuss { font-size: 12.5px; color: #cbd5e1; margin-top: 12px; line-height: 1.7; }
  .duell .fuss b { color: #fde68a; }
  .pokal { font-size: 15px; }

  /* Tagesauftrag */
  .auftrag { background: linear-gradient(180deg,#14283f,#1e293b); border: 2px solid #38bdf8;
             border-radius: 16px; padding: 16px 18px; margin-bottom: 18px; }
  .auftrag.fertig { border-color: #4ade80; }
  .auftrag h2 { font-size: 17px; color: #7dd3fc; display: flex; justify-content: space-between;
                align-items: baseline; gap: 10px; }
  .auftrag.fertig h2 { color: #86efac; }
  .auftrag h2 small { font-size: 11.5px; font-weight: 600; color: #94a3b8; }
  .auftrag a { display: flex; gap: 9px; align-items: baseline; padding: 6px 0;
               font-size: 13.5px; color: #cbd5e1; text-decoration: none; border-top: 1px solid #26405c; }
  .auftrag a.ok { color: #64748b; }
  .auftrag a.ok .n { text-decoration: line-through; }
  .auftrag .lohn { font-size: 12.5px; color: #94a3b8; margin-top: 10px; line-height: 1.6; }
  .auftrag .lohn b { color: #fbbf24; }

  .offenbox { background: #1e293b; border: 2px solid #334155; border-radius: 16px;
              padding: 16px 18px; margin-top: 20px; }
  .offenbox h2 { font-size: 17px; margin-bottom: 3px; }
  .offenbox .lp { font-size: 12px; color: #64748b; margin-bottom: 12px; }
  .ogruppe { margin-top: 14px; }
  .ogruppe .kopf { font-size: 13px; font-weight: 700; color: #cbd5e1; margin-bottom: 6px; }
  .oz { display: flex; justify-content: space-between; gap: 10px; align-items: baseline;
        padding: 6px 0; border-top: 1px solid #334155; font-size: 13.5px; }
  .oz .n { color: #e2e8f0; }
  .oz .s { white-space: nowrap; font-size: 12px; font-weight: 700; }
  .oz.zahlt .s { color: #fbbf24; }
  .oz.fertig .n { color: #64748b; }
  .oz.fertig .s { color: #475569; }
  .osum { background: #0f172a; border-radius: 12px; padding: 12px 14px; margin-top: 14px;
          font-size: 13px; line-height: 1.7; color: #cbd5e1; }
  .osum b { color: #fbbf24; }
  .lnk { display: block; text-align: center; padding: 13px; border-radius: 12px; margin-top: 18px;
         background: #1e3a5f; border: 2px solid #fde68a; color: #fde68a; text-decoration: none; font-weight: 700; }
  footer { text-align: center; margin-top: 24px; font-size: 12px; color: #475569; }
  @media (hover: none) { table { font-size: 15px; } td { padding: 11px 0; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="hud"></div>
  <h1>🏆 Bestenliste</h1>
  <div class="sub">Wer steht wo? Pro Fach die besten Ergebnisse.</div>

  <div class="gesamt" id="gesamt"></div>
  <div class="duell" id="duell"></div>
  <div id="auftrag"></div>
  <div id="faecher"></div>
  <div class="offenbox" id="offen"></div>

  <a class="lnk" href="/lernwelt/">🏝️ Zurück zur Insel</a>
  <footer>hodelweb.ch/lernwelt/bestenliste</footer>
</div>

<script src="/lernwelt/insel.js"></script>
<script src="/lernwelt/uebungen.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var ich = Insel.who();
  var kinder = Object.keys(Insel.kinder);

  Insel.hudLeiste($('hud'));

  /* ---------- Zahlen je Kind und Fach ---------- */
  function fachDaten(who, fach) {
    var u = Insel.uebungenImFach(fach, who);
    return {
      uebungen: u.length,
      versuche: u.reduce(function (n, x) { return n + (x.versuche || 0); }, 0),
      gemeistert: u.filter(function (x) { return x.gemeistert; }).length,
      best: u.reduce(function (m, x) { return Math.max(m, x.best || 0); }, 0),
      schnitt: u.length ? Math.round(u.reduce(function (n, x) { return n + (x.best || 0); }, 0) / u.length) : 0,
      sterne: Insel.sterne(fach, who),
      muenzen: u.reduce(function (n, x) { return n + (x.muenzenTotal || 0); }, 0)
    };
  }
  function punkte(who) {
    var p = 0;
    Object.keys(Insel.faecher).forEach(function (f) {
      var d = fachDaten(who, f);
      p += d.gemeistert * 10 + d.sterne * 5 + Math.round(d.schnitt / 10);
    });
    return p;
  }

  /* ---------- Gesamtübersicht ---------- */
  function gesamt() {
    var box = $('gesamt');
    box.innerHTML = '';
    var werte = kinder.map(function (k) { return { name: k, p: punkte(k) }; });
    var max = Math.max.apply(null, werte.map(function (x) { return x.p; }));
    werte.sort(function (a, b) { return b.p - a.p; });
    werte.forEach(function (w) {
      var k = Insel.kinder[w.name];
      var d = document.createElement('div');
      d.className = 'kind' + (w.p === max && max > 0 ? ' fuehrt' : '');
      d.innerHTML = '<div class="e">' + k.emoji + '</div>' +
        '<div class="n">' + w.name + (w.name === ich ? ' ·' : '') + '</div>' +
        '<div class="kl">' + k.klasse + '. Klasse</div>' +
        '<div class="p">' + w.p + '</div><div class="pl">Punkte</div>';
      box.appendChild(d);
    });
  }

  /* ---------- Tafel je Fach ---------- */
  function faecher() {
    var box = $('faecher');
    box.innerHTML = '';
    Object.keys(Insel.faecher).forEach(function (f) {
      var info = Insel.faecher[f];
      var el = document.createElement('div');
      el.className = 'fach ' + f;

      var reihen = kinder.map(function (k) {
        var d = fachDaten(k, f);
        d.name = k;
        return d;
      }).filter(function (d) { return d.uebungen > 0; });
      reihen.sort(function (a, b) { return (b.gemeistert - a.gemeistert) || (b.best - a.best); });

      var kopf = '<h2>' + info.emoji + ' ' + info.name + '</h2>' +
                 '<div class="lp">' + info.ort + '</div>';

      if (!reihen.length) {
        el.innerHTML = kopf + '<div class="leer">Hier hat noch niemand geübt.</div>';
        box.appendChild(el);
        return;
      }

      var tabelle = '<table><tr><th>Kind</th><th>Bestwert</th><th>Schnitt</th>' +
                    '<th>gemeistert</th><th>Sterne</th><th>🪙</th></tr>';
      reihen.forEach(function (d, idx) {
        var medaille = idx === 0 && reihen.length > 1 ? ' 🥇' : '';
        tabelle += '<tr><td' + (idx === 0 ? ' class="sieger"' : '') + '>' +
          Insel.kinder[d.name].emoji + ' ' + d.name + medaille + '</td>' +
          '<td>' + d.best + ' %</td><td>' + d.schnitt + ' %</td>' +
          '<td>' + d.gemeistert + ' / ' + d.uebungen + '</td>' +
          '<td>' + '★'.repeat(d.sterne) + '☆'.repeat(3 - d.sterne) + '</td>' +
          '<td>' + d.muenzen + '</td></tr>';
      });
      tabelle += '</table>';

      /* Balken für den Bestwert */
      var balken = reihen.map(function (d) {
        return '<div style="font-size:12px;color:#94a3b8;margin-top:10px">' + d.name + '</div>' +
               '<div class="balken"><i style="width:' + d.best + '%"></i></div>';
      }).join('');

      /* Beste einzelne Übung im Fach */
      var beste = null;
      kinder.forEach(function (k) {
        Insel.uebungenImFach(f, k).forEach(function (u) {
          if (!beste || (u.best || 0) > beste.best) beste = { best: u.best || 0, titel: u.titel, wer: k };
        });
      });
      var top = beste && beste.best
        ? '<div class="top">Beste Einzelübung: <b>' + beste.titel + '</b> mit ' + beste.best +
          ' % von ' + beste.wer + '.</div>'
        : '';

      el.innerHTML = kopf + tabelle + balken + top;
      box.appendChild(el);
    });
  }

  /* ---------- Was zahlt noch Münzen? ---------- */
  function offeneListe() {
    var box = $('offen');
    var klasse = Insel.klasse(ich);
    var zeilen = '', offen = 0, gesamt = 0;

    function zeile(name, ms) {
      gesamt++;
      if (ms.zahlt) offen++;
      return '<div class="oz ' + (ms.zahlt ? 'zahlt' : 'fertig') + '">' +
             '<span class="n">' + name + '</span>' +
             '<span class="s">' + ms.kurz + '</span></div>';
    }

    Object.keys(Insel.faecher).forEach(function (f) {
      var listen = Uebungen.fuer(f, klasse);
      if (!listen.eigene.length) return;
      var inhalt = listen.eigene.map(function (u) {
        return zeile(u.titel, Insel.muenzStatus(f, u.id, u.schwierigkeit, ich));
      }).join('');
      zeilen += '<div class="ogruppe"><div class="kopf">' + Insel.faecher[f].emoji + ' ' +
                Insel.faecher[f].kurz + '</div>' + inhalt + '</div>';
    });

    var spiele = Insel.spiele.map(function (sp) {
      var st = Insel.muenzStatusGruppe(sp.fach, sp.sets, sp.schwierigkeit, ich);
      var o = st.offen, g = st.gesamt;
      if (sp.zweit) {
        var z = Insel.muenzStatusGruppe(sp.fach, sp.zweit.sets, sp.zweit.schwierigkeit, ich);
        o += z.offen; g += z.gesamt;
      }
      gesamt++;
      if (o > 0) offen++;
      return '<div class="oz ' + (o > 0 ? 'zahlt' : 'fertig') + '">' +
             '<span class="n">' + sp.titel + '</span><span class="s">' +
             (o > 0 ? (g > 1 ? '🪙 ' + o + ' von ' + g + ' offen' : '🪙 noch offen') : '✔ abgeholt') +
             '</span></div>';
    }).join('');
    zeilen += '<div class="ogruppe"><div class="kopf">🎮 Spiele &amp; Puzzles</div>' + spiele + '</div>';

    box.innerHTML = '<h2>🪙 Was bringt noch Münzen?</h2>' +
      '<div class="lp">Für ' + ich + ', ' + klasse + '. Klasse. Grau heisst: schon abgeholt — ' +
      'üben darfst du weiter, Münzen gibt es dafür keine mehr.</div>' + zeilen +
      '<div class="osum">' +
        (offen
          ? 'Noch <b>' + offen + ' von ' + gesamt + '</b> Aufgaben zahlen Münzen.'
          : 'Du hast überall abgeholt, was es gibt — <b>alle ' + gesamt + '</b> sind erledigt.') +
      '</div>';
  }

  /* ---------- Wochenduell ---------- */
  function restText(sek) {
    var tage = Math.floor(sek / 86400), std = Math.floor((sek % 86400) / 3600);
    if (tage >= 1) return tage + (tage === 1 ? ' Tag' : ' Tage') + ' und ' + std + ' Stunden';
    if (std >= 1) return std + (std === 1 ? ' Stunde' : ' Stunden');
    return Math.max(1, Math.round(sek / 60)) + ' Minuten';
  }
  function duell() {
    var box = $('duell');
    var tabelle = Insel.wochenTabelle();
    var max = Math.max.apply(null, tabelle.map(function (r) { return r.punkte; })) || 1;
    var vorwoche = Insel.wochenSieger(Insel.letzteWoche());

    var zeilen = tabelle.map(function (r, i) {
      var k = Insel.kinder[r.name] || { emoji: '🙂' };
      var fuehrt = r.punkte > 0 && r.punkte === tabelle[0].punkte;
      return '<div class="dz' + (fuehrt ? ' fuehrt' : '') + '">' +
        '<span class="r">' + (i + 1) + '.</span>' +
        '<span class="n">' + k.emoji + ' ' + r.name +
          (r.name === ich ? ' ·' : '') +
          (vorwoche && vorwoche.name === r.name ? ' <span class="pokal" title="Sieger der letzten Woche">🏆</span>' : '') +
        '</span>' +
        '<span class="b"><i style="width:' + Math.round(r.punkte / max * 100) + '%"></i></span>' +
        '<span class="p">' + r.punkte + '</span></div>';
    }).join('');

    var meine = Insel.wochenPunkte(null, ich).punkte;
    var spitze = tabelle[0];
    var abstand = spitze && spitze.name !== ich ? spitze.punkte - meine : 0;

    box.innerHTML =
      '<h2>🏁 Wochenduell<small>noch ' + restText(Insel.wochenRest()) + '</small></h2>' +
      zeilen +
      '<div class="fuss">' +
        (tabelle[0] && !tabelle[0].punkte
          ? 'Diese Woche hat noch niemand geübt. Die erste Übung führt.'
          : abstand > 0
            ? 'Dir fehlen <b>' + abstand + ' Punkte</b> auf ' + spitze.name + '. ' +
              'Ein gutes Ergebnis bringt bis zu 10 Punkte, eine gemeisterte Übung ' +
              Insel.oekonomie.wochenBonusMeister + ' extra.'
            : 'Du führst. Punkte gibt es für jedes Ergebnis, auch wenn eine Übung ' +
              'keine Münzen mehr zahlt.') +
        '<br>Am Sonntag um Mitternacht wird abgerechnet, dann beginnt die nächste Runde.' +
        (vorwoche ? ' Letzte Woche hat <b>' + vorwoche.name + '</b> mit ' + vorwoche.punkte +
                    ' Punkten gewonnen.' : '') +
      '</div>';
  }

  /* ---------- Tagesauftrag ---------- */
  function auftrag() {
    var box = $('auftrag');
    var a = Insel.tagesauftrag(Insel.katalogAus(window.Uebungen, ich), ich);
    if (!a) { box.innerHTML = ''; return; }
    var fertig = a.sets.filter(function (x) { return x.fertig; }).length;
    var alles = fertig === a.sets.length;
    box.innerHTML =
      '<div class="auftrag' + (alles ? ' fertig' : '') + '">' +
      '<h2>' + (alles ? '✅ Tagesauftrag geschafft' : '📋 Tagesauftrag für ' + ich) +
        '<small>' + fertig + ' von ' + a.sets.length + '</small></h2>' +
      a.sets.map(function (x) {
        var f = Insel.faecher[x.fach] || { emoji: '📘' };
        return '<a class="' + (x.fertig ? 'ok' : '') + '" href="/lernwelt/uebung/?fach=' +
               x.fach + '&set=' + x.set + '">' +
               '<span>' + (x.fertig ? '✔' : '○') + '</span>' +
               '<span class="n">' + f.emoji + ' ' + x.titel + '</span></a>';
      }).join('') +
      '<div class="lohn">' + (alles
        ? (a.bonusAbgeholt ? 'Bonus kassiert. Morgen wartet ein neuer Auftrag.'
                           : 'Der Bonus kommt beim nächsten Ergebnis.')
        : 'Jede Übung zählt ab <b>' + Insel.oekonomie.auftragMindest + ' %</b>. Alle zusammen bringen <b>' +
          Insel.oekonomie.auftragBonus + ' Münzen</b> und einen <b>Schatzhinweis</b>.') +
      '</div></div>';
  }

  gesamt();
  duell();
  auftrag();
  faecher();
  offeneListe();
})();
</script>
</body>
</html>
