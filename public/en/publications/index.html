<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publications | Tobias Hodel</title>
  <meta name="description" content="Complete list of publications by Tobias Hodel, Digital Humanities, University of Bern.">
  <link rel="canonical" href="https://www.hodelweb.ch/en/publications/">
  <link rel="alternate" hreflang="de" href="https://www.hodelweb.ch/publikationen/">
  <link rel="alternate" hreflang="en" href="https://www.hodelweb.ch/en/publications/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Publications | Tobias Hodel">
  <meta property="og:url" content="https://www.hodelweb.ch/en/publications/">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    :root {
      --bg: #ffffff;
      --bg-alt: #f7f7f8;
      --text: #111111;
      --text-muted: #6b7280;
      --accent: #2563eb;
      --accent-light: #eff6ff;
      --border: #e5e7eb;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    }
    
    [data-theme="dark"] {
      --bg: #0f172a;
      --bg-alt: #1e293b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #60a5fa;
      --accent-light: #1e293b;
      --border: #334155;
      --card-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.7;
      transition: background 0.3s, color 0.3s;
    }
    
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 960px;
      margin: 0 auto;
      padding: 1.2rem 2rem;
    }
    
    .topbar-left {
      font-weight: 600;
      font-size: 1rem;
    }
    
    .topbar-right {
      display: flex;
      gap: 1rem;
      align-items: center;
    }
    
    .topbar-right a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: color 0.2s;
    }
    
    .topbar-right a:hover {
      color: var(--accent);
    }
    
    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.3rem 0.6rem;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-muted);
      transition: all 0.2s;
    }
    
    .theme-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .page-header {
      margin-bottom: 3rem;
    }
    
    .page-header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }
    
    .page-header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }
    
    .publication-filters {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: var(--bg-alt);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    
    .filters-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
    }
    
    .filters-row input, .filters-row select {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      background: var(--bg);
      color: var(--text);
      min-width: 200px;
    }
    
    .filters-row input {
      flex: 1;
    }
    
    .filters-row input:focus, .filters-row select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    
    .results-info {
      margin-bottom: 2rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    
    .publications-grid {
      display: grid;
      gap: 1.5rem;
    }
    
    .pub-item {
      padding: 1.5rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    
    .pub-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--card-shadow);
    }
    
    .pub-year {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    
    .pub-title {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5;
      margin-bottom: 0.75rem;
    }
    
    .pub-title a {
      color: var(--text);
      text-decoration: none;
    }
    
    .pub-title a:hover {
      color: var(--accent);
    }
    
    .pub-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    
    .pub-type {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 500;
      margin-top: 0.5rem;
    }
    
    .loading {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    
    .no-results {
      text-align: center;
      padding: 3rem;
      color: var(--text-muted);
    }
    
    @media (max-width: 768px) {
      .filters-row {
        flex-direction: column;
        align-items: stretch;
      }
      
      .filters-row input, .filters-row select {
        min-width: auto;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <a href="/" style="color: var(--text); text-decoration: none;">TH</a>
    </div>
    <div class="topbar-right">
      <a href="/">Home</a>
      <a href="/#publications">Publications</a>
      <a href="/#projects">Projects</a>
      <a href="/en/cv/">CV</a>
      <a href="/en/teaching/">Teaching</a>
      
      <a href="/publikationen/">DE</a>
      
      <button class="theme-toggle" onclick="toggleTheme()">◑</button>
    </div>
  </div>
  
  <div class="container">
    <div class="page-header">
      <h1>Publications</h1>
      <p>Complete list of publications by Tobias Hodel (ORCID: 0000-0002-2071-6407)</p>
    </div>
    
    <div class="publication-filters">
      <div class="filters-row">
        <input 
          type="text" 
          id="pub-search" 
          placeholder="Search by title, author or journal..."
        >
        <select id="pub-year-filter">
          <option value="">All years</option>
        </select>
        <select id="pub-type-filter">
          <option value="">All types</option>
        </select>
      </div>
    </div>
    
    <div class="results-info" id="results-info"></div>
    
    <div id="publications-container">
      <div class="loading">
        Loading publications...
      </div>
    </div>
  </div>
  
  <script>
    let allPublications = [];
    let filteredPublications = [];
    
    function toggleTheme() {
      const body = document.body;
      if (body.getAttribute('data-theme') === 'dark') {
        body.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        body.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
    }
    
    
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      document.body.setAttribute('data-theme', 'dark');
    }
    
    function formatAuthors(authors) {
      if (!authors || authors.length === 0) return '';

      
      const names = authors.map(a => a.is_primary ? `<strong>${a.name}</strong>` : a.name);
      
      if (names.length === 1) return names[0];
      if (names.length === 2) return `${names[0]} & ${names[1]}`;
      return `${names.slice(0, -1).join(', ')} & ${names[names.length - 1]}`;
    }
    
    function formatTypeLabel(type) {
      const labels = {
        'journal-article': 'Journal Articles',
        'book': 'Books',
        'book-chapter': 'Book Chapters',
        'conference-paper': 'Conference Papers',
        'edited-book': 'Edited Volumes',
        'other': 'Other',
        'report': 'Reports',
        'dissertation': 'Dissertations'
      };
      return labels[type] || type.replace('-', ' ').replace(/\b\w/g, l => l.toUpperCase());
    }
    
    async function loadPublications() {
      try {
        const response = await fetch('/publications.json');
        allPublications = await response.json();
        filteredPublications = [...allPublications];
        
        populateFilters();
        displayPublications();
        updateResultsInfo();
        
        
        document.getElementById('pub-search').addEventListener('input', filterPublications);
        document.getElementById('pub-year-filter').addEventListener('change', filterPublications);
        document.getElementById('pub-type-filter').addEventListener('change', filterPublications);
        
      } catch (error) {
        console.error('Error loading publications:', error);
        document.getElementById('publications-container').innerHTML = `
          <div class="no-results">
            Error loading publications. Please try again later.
          </div>
        `;
      }
    }
    
    function populateFilters() {
      
      const years = [...new Set(allPublications.map(pub => pub.year).filter(year => year && year !== 'n.d.'))].sort((a, b) => b - a);
      const yearFilter = document.getElementById('pub-year-filter');
      years.forEach(year => {
        const option = document.createElement('option');
        option.value = year;
        option.textContent = year;
        yearFilter.appendChild(option);
      });
      
      
      const types = [...new Set(allPublications.map(pub => pub.type).filter(type => type))].sort();
      const typeFilter = document.getElementById('pub-type-filter');
      types.forEach(type => {
        const option = document.createElement('option');
        option.value = type;
        option.textContent = formatTypeLabel(type);
        typeFilter.appendChild(option);
      });
    }
    
    function filterPublications() {
      const searchTerm = document.getElementById('pub-search').value.toLowerCase();
      const yearFilter = document.getElementById('pub-year-filter').value;
      const typeFilter = document.getElementById('pub-type-filter').value;
      
      filteredPublications = allPublications.filter(pub => {
        const matchesSearch = !searchTerm || 
          pub.title.toLowerCase().includes(searchTerm) ||
          (pub.authors && pub.authors.some(author => author.name.toLowerCase().includes(searchTerm))) ||
          (pub.journal && pub.journal.toLowerCase().includes(searchTerm));
        
        const matchesYear = !yearFilter || pub.year == yearFilter;
        const matchesType = !typeFilter || pub.type === typeFilter;
        
        return matchesSearch && matchesYear && matchesType;
      });
      
      displayPublications();
      updateResultsInfo();
    }
    
    function displayPublications() {
      const container = document.getElementById('publications-container');
      
      if (filteredPublications.length === 0) {
        container.innerHTML = `
          <div class="no-results">
            No publications found.
          </div>
        `;
        return;
      }
      
      let html = '<div class="publications-grid">';
      
      filteredPublications.forEach(pub => {
        const authors = formatAuthors(pub.authors);
        const title = pub.doi ? `<a href="https://doi.org/${pub.doi}" target="_blank">${pub.title}</a>` : pub.title;

        let citation = title;
        if (authors) {
          citation = `${authors} (${pub.year || 'n.d.'}). ${title}`;
        }
        
        html += `
          <div class="pub-item">
            <div class="pub-year">${pub.year || 'n.d.'}</div>
            <div class="pub-title">${citation}</div>
            ${pub.journal ? `<div class="pub-meta"><em>${pub.journal}</em></div>` : ''}
            <div class="pub-type">${formatTypeLabel(pub.type)}</div>
          </div>
        `;
      });
      
      html += '</div>';
      container.innerHTML = html;
    }
    
    function updateResultsInfo() {
      const info = document.getElementById('results-info');
      const total = allPublications.length;
      const showing = filteredPublications.length;
      
      if (showing === total) {
        info.textContent = `${total} publications total`;
      } else {
        info.textContent = `${showing} of ${total} publications`;
      }
    }
    
    
    document.addEventListener('DOMContentLoaded', loadPublications);
  </script>
</body>
</html>
